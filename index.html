<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scroll to Top Ladder Lottie</title>

  <style>
    html, body { height: 100%; margin: 0; background: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    /* Dummy content */
    .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 220px; }
    .hero { padding: 28px; border-radius: 18px; background: #fff3e6; border: 2px solid rgba(245,124,0,0.25); margin-bottom: 24px; }
    .blocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .block { height: 260px; border-radius: 18px; background: linear-gradient(135deg, rgba(245,124,0,0.95), rgba(245,124,0,0.55)); box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
    @media (max-width: 720px) { .blocks { grid-template-columns: 1fr; } }

    /* Widget */
    .scroll-widget {
      position: fixed;
      z-index: 9999;
      right: 0; bottom: 0;
      width: 1px; height: 1px;
      pointer-events: none;
    }

    #rig {
      position: absolute;
      right: 0; bottom: 0;
      transform-origin: bottom right;
      will-change: transform;
      pointer-events: none;
      opacity: 1; /* always visible */
    }

    #ladder {
      position: absolute;
      right: 0;
      bottom: 0;
      transform-origin: bottom right;
      will-change: transform, opacity;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.10));
    }

    #charBtn {
      position: absolute;
      right: 0;
      bottom: 0;
      border: none;
      background: transparent;
      padding: 0; margin: 0;
      cursor: pointer;
      pointer-events: auto;
      transform-origin: bottom right;
      will-change: transform;
      border-radius: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    #charBtn:focus-visible { outline: 3px solid rgba(245,124,0,0.55); outline-offset: 6px; }

    #lottieHost { width: 100%; height: 100%; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hero">
      <h1 style="margin: 0 0 8px;">Scroll down and click the character</h1>
      <p style="margin: 0; opacity: 0.8;">Dummy orange blocks below so there’s plenty to scroll.</p>
    </div>

    <div class="blocks" aria-hidden="true">
      <div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div>
      <div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div>
      <div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div>
    </div>
  </div>

  <div class="scroll-widget">
    <div id="rig">
      <img id="ladder" src="Ladder.svg" alt="" />
      <button id="charBtn" type="button" aria-label="Scroll to top">
        <div id="lottieHost"></div>
      </button>
    </div>
  </div>

  <!-- Lottie (no integrity to avoid SRI blocking on Pages) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" crossorigin="anonymous"></script>

  <script>
    /**
     * ========================
     * EASY TUNING VARIABLES
     * ========================
     */
    const CONFIG = {
      // Placement
      rightPx: 18,
      bottomPx: 18,

      // Overall widget scale (scales both ladder and character together)
      rigScale: 0.55,

      // Character size
      charBaseSizePx: 160,

      // Ladder sizing (extra control so you can shrink ladder without shrinking character)
      ladderWidthPx: 200,      // <-- smaller default than before
      ladderScale: 0.3,       // <-- extra shrink
      ladderRightOffsetPx: 8,  // tweak alignment
      ladderBottomOffsetPx: 0,

      // Timing
      ladderSlideInMs: 400,
      climbDurationMs: 3000,   // page scroll duration too
      floatDownMs: 2600,       // slow float down duration
      settleMs: 180,

      // Motion distance (visual)
      climbRisePx: 320,

      // Lottie assets
      lottieIdlePath: "Idle.json",
      lottieClimbPath: "Climbing.json",
      lottieJumpPath: "Jump.json",

      // Behavior
      disableWhileRunning: true,
    };

    /**
     * ========================
     * Helpers
     * ========================
     */
    const clamp01 = (t) => Math.max(0, Math.min(1, t));
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOutCubic = (t) => (t < 0.5) ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

    function rafTween(durationMs, onUpdate, onDone, easing = (t) => t) {
      const start = performance.now();
      function tick(now) {
        const t = clamp01((now - start) / durationMs);
        onUpdate(easing(t));
        if (t < 1) requestAnimationFrame(tick);
        else onDone && onDone();
      }
      requestAnimationFrame(tick);
    }

    const getScrollTop = () => window.pageYOffset || document.documentElement.scrollTop || 0;
    const setScrollTop = (y) => window.scrollTo({ top: y, left: 0, behavior: "auto" });

    /**
     * ========================
     * DOM + layout
     * ========================
     */
    const rig = document.getElementById("rig");
    const ladder = document.getElementById("ladder");
    const charBtn = document.getElementById("charBtn");
    const lottieHost = document.getElementById("lottieHost");

    function applyLayout() {
      rig.style.right = `${CONFIG.rightPx}px`;
      rig.style.bottom = `${CONFIG.bottomPx}px`;
      rig.style.transform = `scale(${CONFIG.rigScale})`;

      charBtn.style.width = `${CONFIG.charBaseSizePx}px`;
      charBtn.style.height = `${CONFIG.charBaseSizePx}px`;

      ladder.style.width = `${CONFIG.ladderWidthPx}px`;
      ladder.style.right = `${CONFIG.ladderRightOffsetPx}px`;
      ladder.style.bottom = `${CONFIG.ladderBottomOffsetPx}px`;
    }
    applyLayout();
    window.addEventListener("resize", applyLayout);

    /**
     * ========================
     * Lottie loading
     * ========================
     */
    let anim = null;

    function loadLottie(path, { loop = true, autoplay = true } = {}) {
      if (anim) {
        try { anim.destroy(); } catch(e) {}
        anim = null;
      }
      anim = lottie.loadAnimation({
        container: lottieHost,
        renderer: "svg",
        loop,
        autoplay,
        path,
      });
      return anim;
    }

    function forcePlayFromStart(a) {
      try {
        a.stop();
        a.goToAndPlay(0, true);
      } catch(e) {}
    }

    // Start idle
    loadLottie(CONFIG.lottieIdlePath, { loop: true, autoplay: true });

    /**
     * ========================
     * Motion / sequence
     * ========================
     */
    let running = false;
    function setRunning(v) {
      running = v;
      if (CONFIG.disableWhileRunning) {
        charBtn.disabled = v;
        charBtn.style.cursor = v ? "default" : "pointer";
      }
    }

    function resetTransforms() {
      charBtn.style.transform = "translate3d(0,0,0)";
      ladder.style.opacity = "0";
      ladder.style.transform = `translate3d(120%,0,0) scale(${CONFIG.ladderScale})`;
    }
    resetTransforms();

    function ladderSlideIn(cb) {
      ladder.style.opacity = "1";
      rafTween(CONFIG.ladderSlideInMs, (t) => {
        const x = (1 - easeOutCubic(t)) * 120; // %
        ladder.style.transform = `translate3d(${x}%,0,0) scale(${CONFIG.ladderScale})`;
      }, cb);
    }

    // slide out but allow us to drive it in-parallel (we expose progress control)
    function ladderSetSlideOutProgress(t) {
      const x = easeInOutCubic(t) * 120;
      ladder.style.transform = `translate3d(${x}%,0,0) scale(${CONFIG.ladderScale})`;
      ladder.style.opacity = `${1 - t}`;
    }

    function climbAndScrollToTop(cb) {
      const startScroll = getScrollTop();
      const rise = CONFIG.climbRisePx;

      rafTween(CONFIG.climbDurationMs, (t) => {
        const eased = easeInOutCubic(t);

        // visual climb
        const y = -rise * eased;
        charBtn.style.transform = `translate3d(0, ${y}px, 0)`;

        // scroll up synced
        const scrollY = startScroll * (1 - eased);
        setScrollTop(scrollY);
      }, cb);
    }

    function floatDownWithLadderOut(cb) {
      const rise = CONFIG.climbRisePx;

      // Run BOTH:
      // - character descends
      // - ladder slides out to right
      rafTween(CONFIG.floatDownMs, (t) => {
        const eased = easeOutCubic(t);

        // character floats down
        const y = -rise * (1 - eased);
        charBtn.style.transform = `translate3d(0, ${y}px, 0)`;

        // ladder exits during the descent
        ladderSetSlideOutProgress(t);
      }, () => {
        // settle to exact idle position
        rafTween(CONFIG.settleMs, (t) => {
          const eased = easeOutCubic(t);
          const y = 5 * (1 - eased);
          charBtn.style.transform = `translate3d(0, ${y}px, 0)`;
        }, () => {
          charBtn.style.transform = "translate3d(0,0,0)";
          ladder.style.opacity = "0";
          cb && cb();
        });
      });
    }

    async function runSequence() {
      if (running) return;
      setRunning(true);

      ladderSlideIn(() => {
        // CLIMB
        const climbAnim = loadLottie(CONFIG.lottieClimbPath, { loop: true, autoplay: true });
        forcePlayFromStart(climbAnim);

        climbAndScrollToTop(() => {
          // SWITCH to JUMP
          const jumpAnim = loadLottie(CONFIG.lottieJumpPath, { loop: false, autoplay: true });
          forcePlayFromStart(jumpAnim);

          // FLOAT DOWN while ladder exits right
          floatDownWithLadderOut(() => {
            // back to IDLE
            const idleAnim = loadLottie(CONFIG.lottieIdlePath, { loop: true, autoplay: true });
            forcePlayFromStart(idleAnim);

            setRunning(false);
          });
        });
      });
    }

    charBtn.addEventListener("click", runSequence);
    charBtn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); runSequence(); }
    });
  </script>
</body>
</html>
